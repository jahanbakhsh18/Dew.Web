#version: "3.9"
services:
  dew_web:
    container_name: dew_web
    image: dew_web:1.0.0
    restart: unless-stopped
    environment:
      TZ: Asia/Tehran
    ports:
      - 5001:5001
    expose:
      - 5001
    healthcheck:
      test: timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/5001'
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    #volumes:
    #  - /home/jahan/application/app/App_Data:/App_Data
    networks:
      - internal

networks:
  internal:


